<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2C5F8A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 卷轴 -->
  <rect x="120" y="130" width="272" height="240" rx="8" fill="#FFF8DC" stroke="#D4A574" stroke-width="4"/>
  <!-- 卷轴上下装饰 -->
  <rect x="110" y="120" width="292" height="18" rx="6" fill="#D4A574"/>
  <rect x="110" y="362" width="292" height="18" rx="6" fill="#D4A574"/>
  <!-- 文字线条 -->
  <rect x="145" y="170" width="180" height="6" rx="3" fill="#8B7355" opacity="0.6"/>
  <rect x="145" y="200" width="220" height="6" rx="3" fill="#8B7355" opacity="0.6"/>
  <rect x="145" y="230" width="160" height="6" rx="3" fill="#8B7355" opacity="0.6"/>
  <rect x="145" y="270" width="200" height="6" rx="3" fill="#8B7355" opacity="0.6"/>
  <rect x="145" y="300" width="170" height="6" rx="3" fill="#8B7355" opacity="0.6"/>
  <rect x="145" y="330" width="210" height="6" rx="3" fill="#8B7355" opacity="0.6"/>
  <!-- 年份标记 -->
  <text x="340" y="195" font-family="Arial" font-size="20" fill="#D4A574" font-weight="bold">8/1</text>
  <text x="256" y="470" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#fff">今天</text>
</svg>