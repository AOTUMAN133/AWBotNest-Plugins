<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="天空答题">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#1a1a3e"/>
      <stop offset=".55" stop-color="#0d0d2b"/>
      <stop offset="1" stop-color="#060618"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect x="14" y="14" width="484" height="484" rx="116" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="105" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  
  <g filter="url(#shadow)">
    <rect x="130" y="90" width="252" height="60" rx="12" fill="#11152f" stroke="#818cf8" stroke-width="10"/>
    <rect x="130" y="180" width="252" height="60" rx="12" fill="#11152f" stroke="#818cf8" stroke-width="10" opacity=".7"/>
    <rect x="130" y="270" width="252" height="60" rx="12" fill="#11152f" stroke="#818cf8" stroke-width="10" opacity=".4"/>
    <text x="256" y="130" text-anchor="middle" fill="#818cf8" font-size="36" font-family="sans-serif">Q</text>
    <text x="256" y="220" text-anchor="middle" fill="#818cf8" font-size="36" font-family="sans-serif">A</text>
    <text x="256" y="310" text-anchor="middle" fill="#818cf8" font-size="36" font-family="sans-serif" opacity=".5">Q</text>
  </g>

  <text x="256" y="480" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="sans-serif" font-weight="500">天空答题</text>
</svg>